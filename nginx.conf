server {
    listen 80;
    server_name localhost;

    # Снимаем лимит на размер загружаемых файлов в FileGator
    client_max_body_size 1024M;

    location / {
        proxy_pass http://file-manager:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Удаляем исходные заголовки, запрещающие iframe
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # 2. Явно разрешаем открывать интерфейс во фрейме для kb-manager (порт 5000)
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5000 http://127.0.0.1:5000" always;

        # 3. Разрешаем передачу данных между разными портами
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        # Таймауты для загрузки/скачивания больших файлов
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}