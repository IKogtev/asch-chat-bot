server {
    listen 80;
    server_name localhost;

    client_max_body_size 1024M;

    location / {
        proxy_pass http://file-manager:8080;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Разрешаем отображение во фрейме kb-manager
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5000 http://127.0.0.1:5000" always;

        # Разрешаем CORS с передачей cookies
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, x-csrf-token" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, x-csrf-token" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Форсируем корректные флаги для сессионных кук самого FileGator
        proxy_cookie_path / "/; SameSite=None; Secure";
    }
}