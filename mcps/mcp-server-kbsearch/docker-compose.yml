services:
  kbsearch:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-server-kbsearch:latest
    container_name: mcp-kbsearch
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      # Основные настройки сервера
      - MCP_HOST=0.0.0.0
      - MCP_PORT=7001
      - MCP_KBSEARCH=/kbsearch
      - MCP_TOKEN=${MCP_TOKEN:-REDACTED_EXAMPLE}
      - IN_DOCKER=true
      - LOG_TO_FILE=false
      
      # Настройки удалённого эмбеддинга
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-https://api.llm.nstcloud.ru/v1/embeddings}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-REDACTED_EXAMPLE}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}

      # Настройки эмбеддинга и индексирования
      - KB_CHUNK_SIZE=512
      - KB_CHUNK_OVERLAP=50
      - KB_SIMILARITY_TOP_K=${KB_SIMILARITY_TOP_K:-10}
      - KB_SIMILARITY_CUTOFF=${KB_SIMILARITY_CUTOFF:-0.5}

      # Qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=kb_collection
      - USE_QDRANT=true
      - KB_QDRANT_RETRY_INTERVAL=${KB_QDRANT_RETRY_INTERVAL:-10}
      - KB_QDRANT_INIT_TIMEOUT=${KB_QDRANT_INIT_TIMEOUT:-600}

    networks:
      - mcp-network
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7001/kb/status')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  mcp-network:
    external: true
