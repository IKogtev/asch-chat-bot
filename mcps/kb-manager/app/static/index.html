<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qdrant Document Manager</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Qdrant Document Manager</h1>
            <div class="header-info">
                <span id="collection-info"></span>
            </div>
        </header>
        
        <!-- Collections view -->
        <div class="collection-selector">
            <label for="collection-select">
                <strong>Active collection:</strong>
                <span id="current-collection" class="collection-current"></span>
                <button 
                id="delete-collection-btn" 
                class="btn btn-danger btn-small" 
                title="Delete collection">🗑️ Delete</button>            
            </label>
            <select id="collection-select">
                <option value="">Loading collections…</option>
            </select>
            <button onclick="openCreateCollectionModal()" class="btn btn-add btn-small">Add collection</button>
            <button onclick="openSwitchCollectionModal()" class="btn btn-primary btn-small">Switch alias 🔄</button>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('documents')">Documents</button>
            <button class="tab-button" onclick="showTab('search')">Search</button>
            <button class="tab-button" onclick="showTab('upload')">Upload</button>
            <button class="tab-button" onclick="showTab('tree_files')">Tree Files</button>
        </div>

        <!-- Documents Tab -->
        <div id="documents-tab" class="tab-content active">
            <div class="section-header">
                <h2>Documents</h2>
                <button onclick="loadDocuments()" class="btn btn-secondary">
                    Refresh
                </button>
            </div>
            
            <div id="documents-list" class="documents-list">
                <div class="loading">Loading documents...</div>
            </div>
        </div>

        <!-- Search Tab -->
        <div id="search-tab" class="tab-content">
            <div class="section-header">
                <h2>Search Documents</h2>
            </div>
            
            <div class="search-section">
                <div class="search-input-group">
                    <input 
                        type="text" 
                        id="search-query" 
                        placeholder="Enter search query..."
                        onkeypress="handleSearchKeypress(event)"
                    >
                    <button onclick="performSearch()" class="btn btn-primary">
                        Search
                    </button>
                </div>
                
                <div class="search-options">
                    <label>
                        Knowledge Base:
                        <select id="search-kb">
                            <option value="">All Knowledge Bases</option>
                        </select>
                    </label>
                    <label>
                        Results limit:
                        <select id="search-limit">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                        </select>
                    </label>
                </div>
            </div>

            <div id="search-results" class="search-results"></div>
        </div>

        <!-- Upload Tab -->
        <div id="upload-tab" class="tab-content">
            <div class="section-header">
                <h2>Upload Document</h2>
            </div>
            
            <div class="upload-section">
                <div class="upload-box" id="upload-box">
                    <div class="upload-icon"></div>
                    <p>Drag & drop a file here or click to select</p>
                    <p class="upload-hint">Supported: TXT, MD, PDF, DOCX, EXCEL</p>
                </div>
                
                <input 
                    type="file" 
                    id="file-input" 
                    accept=".txt,.md,.pdf,.docx,.doc,.csv,.xls,.xlsx" 
                    onchange="handleFileSelect(event)"
                    style="display: none;"
                >

                <div id="file-info" class="file-info" style="display: none;">
                    <p><strong>Selected file:</strong> <span id="file-name"></span></p>
                </div>

                <div class="upload-options">
                    <label>
                        Knowledge Base ID:
                        <input type="text" id="upload-kb-id" value="default" placeholder="e.g., default, kb1, kb2">
                    </label>
                    <label>
                        User ID:
                        <input type="text" id="upload-user-id" value="anonymous" placeholder="e.g., user123, anonymous">
                    </label>
                </div>

                <button onclick="uploadDocument()" id="upload-btn" class="btn btn-primary btn-large" disabled>
                     Upload Document
                </button>

                <div id="upload-progress" class="upload-progress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <p>Processing document...</p>
                </div>

                <div id="upload-result" class="result-message"></div>
            </div>
        </div>

        <!-- Tree tab -->
        <div id="tree_files-tab" class="tab-content">
            <div id="filesystem-tree"></div>
        </div>

        <!-- Modal for viewing document chunks -->
        <div id="chunks-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">Document Chunks</h3>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div id="modal-body" class="modal-body"></div>
            </div>
        </div>
    
        <!-- Modal for creating collection -->
        <div id="create-collection-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create collection</h3>
                    <button class="modal-close" onclick="closeCreateCollectionModal()">&times;</button>
                </div>

                <div class="modal-body">
                    <input
                        type="text"
                        id="newCollectionVersion"
                        placeholder="Version (e.g. v1)"
                    />

                    <div class="search-options">
                        <select id="newCollectionType">
                            <option value="faq">FAQ</option>
                            <option value="kb">Knowledge Base</option>
                        </select>
                    </div>
                    
                    <div class="actions">
                        <button onclick="createCollection()" class="btn btn-primary">Create</button>
                    </div>

                    <div id="create-collection-error" class="error hidden"></div>
                </div>
            </div>
        </div>
        <!-- Modal for switching collection -->
        <div id="switch-collection-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Switch collection alias</h3>
                    <button class="modal-close" onclick="closeSwitchCollectionModal()">&times;</button>
                </div>

                <div class="modal-body">
                    
                    <div class="search-options">
                        <label>Collection type</label>
                        <select id="switchCollectionType" onchange="loadAliasCollections()">
                            <option value="faq">FAQ</option>
                            <option value="kb">Knowledge Base</option>
                        </select>
                    </div>

                    <div class="search-options">
                        <label>Target collection</label>
                        <select id="switchCollectionTarget"></select>
                    </div>
                    
                    <div class="actions">
                        <button onclick="switchCollectionAlias()" class="btn btn-primary">Switch alias</button>
                    </div>

                    <div id="switch-collection-error" class="error hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=15" defer></script>
</body>
</html>
