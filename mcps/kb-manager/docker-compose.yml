services:
  # Knowledge base manager (web UI for document management)
  kb-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: kb-manager:latest
    container_name: kb-manager
    restart: unless-stopped
    ports:
      - 5000:5000
    volumes:
      - T:\kb_storage:/app/data/kb_documents
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      - QDRANT_COLLECTION=kb_collection
      - EMBEDDING_MODEL=Qwen/Qwen3-Embedding-0.6B
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=20
      - LOG_TO_FILE=false
      - KB_STORAGE_ROOT=/app/data/kb_documents
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    external: true
