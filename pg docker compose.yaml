services:
  postgres:
    image: postgres:16
    container_name: aszh-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aszh-bot
      POSTGRES_PASSWORD: aszh-bot
      POSTGRES_DB: aszh-bot
      TZ: Europe/Moscow
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aszh-bot -d aszh-bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aszh-bot-network

volumes:
  pg_data:

networks:
  aszh-bot-network:
    external: true