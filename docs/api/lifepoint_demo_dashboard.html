<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifePoint API Tester & Demo</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #161e2e;
      --border: #2d3748;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --code-bg: #030712;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.4; }

    .header {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.3rem; }
    .badge { background: var(--primary); padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; text-transform: uppercase; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width: 1024px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 14px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .form-control:focus { border-color: var(--primary); outline: none; }
    .row { display: flex; gap: 10px; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #059669; }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }
    .btn-copy { background: #334155; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; border: none; color: #fff; cursor: pointer; float: right; }
    .btn-copy:hover { background: #475569; }

    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .code-block {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #a7f3d0;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 250px;
      overflow-y: auto;
    }

    .status-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
    .status-200 { background: rgba(16,185,129,0.2); color: var(--success); }
    .status-err { background: rgba(239,68,68,0.2); color: var(--danger); }
    
    .env-badge {
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="header">
  <h1>LifePoint ↔ ИС "Настя" </h1>
  <div class="env-badge">Активный хост: <b id="activeHostLabel" style="color: #fff;">localhost</b></div>
</div>

<div class="grid">
  <!-- LEFT COLUMN: CONFIG & INPUT FORM -->
  <div>
    <!-- GLOBAL ENVIRONMENT CONFIG -->
    <div class="card">
      <h2>⚙️ Глобальные настройки окружения</h2>
      <div class="row" style="margin-bottom: 10px;">
        <button class="btn btn-secondary" onclick="applyPreset('local')">🖥️ Пресет: Local</button>
        <button class="btn btn-secondary" onclick="applyPreset('dev')">🌐 Пресет: Dev-стенд</button>
      </div>
      <div class="row">
        <div class="form-group" style="flex: 0.8;">
          <label>Протокол:</label>
          <select id="envScheme" class="form-control" onchange="updateCalculatedUrls()">
            <option value="http">http</option>
            <option value="https">https</option>
          </select>
        </div>
        <div class="form-group" style="flex: 2;">
          <label>&lt;KEYCLOAK_HOST&gt;:</label>
          <input type="text" id="envKcHost" class="form-control" value="localhost:8088" oninput="updateCalculatedUrls()">
        </div>
        <div class="form-group" style="flex: 1.5;">
          <label>&lt;REALM_NAME&gt;:</label>
          <input type="text" id="envRealm" class="form-control" value="kb-manager-test" oninput="updateCalculatedUrls()">
        </div>
      </div>
      <div class="form-group">
        <label>&lt;NST_HOST&gt; (Хост API ИС "Настя"):</label>
        <input type="text" id="envNstHost" class="form-control" value="localhost:5000" oninput="updateCalculatedUrls()">
      </div>
    </div>

    <!-- KEYCLOAK AUTH -->
    <div class="card">
      <h2>1. Авторизация Keycloak</h2>
      <div class="form-group">
        <label>Сформированный Token URL:</label>
        <input type="text" id="kcUrl" class="form-control" readonly style="opacity: 0.8;">
      </div>
      <div class="row">
        <div class="form-group" style="flex: 1;">
          <label>client_id:</label>
          <input type="text" id="clientId" class="form-control" value="lifepoint">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>client_secret:</label>
          <input type="password" id="clientSecret" class="form-control" placeholder="Введите секрет клиента">
        </div>
      </div>
      
      <div class="row" style="margin-bottom: 10px;">
        <button class="btn" onclick="requestToken()">🔑 Получить Bearer Token</button>
        <button class="btn btn-secondary" onclick="promptPasteToken()">📋 Вставить токен вручную</button>
      </div>

      <div class="form-group" style="margin-top: 12px;">
        <label>Текущий Authorization Bearer Token:</label>
        <textarea id="bearerToken" class="form-control" rows="3" placeholder="Токен появится здесь после получения или вставьте токен вручную"></textarea>
      </div>
    </div>

    <!-- API ENDPOINTS -->
    <div class="card">
      <h2>2. Методы API ИС "Настя"</h2>
      <div class="form-group">
        <label>Сформированный Base API URL:</label>
        <input type="text" id="apiUrl" class="form-control" readonly style="opacity: 0.8;">
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabBtnUsers" onclick="setTab('users')">GET /users</button>
        <button class="tab-btn" id="tabBtnNotify" onclick="setTab('notify')">POST /notifications</button>
      </div>

      <!-- GET /users Form -->
      <div id="tabUsers">
        <div class="form-group">
          <label>global_user_id (UUID):</label>
          <input type="text" id="getUserUuid" class="form-control" value="Введите сюда UUID пользователя">
        </div>
        <button class="btn btn-success" onclick="execGetUser()">🔍 Запросить профиль пользователя</button>
      </div>

      <!-- POST /notifications Form -->
      <div id="tabNotify" style="display: none;">
        <div class="form-group">
          <label>global_user_id (UUID):</label>
          <input type="text" id="postUserUuid" class="form-control" value="Введите сюда UUID пользователя">
        </div>
        <div class="form-group">
          <label>channel (Канал):</label>
          <select id="postChannel" class="form-control">
            <option value="max">max</option>
            <option value="telegram">telegram</option>
            <option value="all">all</option>
          </select>
        </div>
        <div class="form-group">
          <label>message (Текст уведомления):</label>
          <input type="text" id="postMessage" class="form-control" value="Тестовое уведомление">
        </div>
        <button class="btn btn-success" onclick="execSendNotification()">🚀 Отправить уведомление</button>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN: RESULTS & CURL GENERATOR -->
  <div>
    <!-- LIVE CURL GENERATOR -->
    <div class="card">
      <h2>
        Сгенерированный cURL
        <button class="btn-copy" onclick="copyCurl()">Скопировать cURL</button>
      </h2>
      <div class="code-block" id="curlOutput"># Выполните действие слева для генерации cURL...</div>
    </div>

    <!-- RESPONSE INSPECTOR -->
    <div class="card">
      <h2>
        Ответ Сервера
        <span id="statusTag"></span>
      </h2>
      <div class="code-block" id="responseOutput">// Результат ответа от сервера...</div>
    </div>
  </div>
</div>

<script>
  // Автоматическая сборка URL на основе параметров окружения
  function updateCalculatedUrls() {
    const scheme = document.getElementById('envScheme').value;
    const kcHost = document.getElementById('envKcHost').value.trim();
    const realm = document.getElementById('envRealm').value.trim();
    const nstHost = document.getElementById('envNstHost').value.trim();

    const kcUrl = `${scheme}://${kcHost}/realms/${realm}/protocol/openid-connect/token`;
    const apiUrl = `${scheme}://${nstHost}/api/v1`;

    document.getElementById('kcUrl').value = kcUrl;
    document.getElementById('apiUrl').value = apiUrl;
    document.getElementById('activeHostLabel').innerText = nstHost || 'Custom';
  }

  function applyPreset(preset) {
    if (preset === 'local') {
      document.getElementById('envScheme').value = 'http';
      document.getElementById('envKcHost').value = 'localhost:8088';
      document.getElementById('envRealm').value = 'kb-manager-test';
      document.getElementById('envNstHost').value = 'localhost:5000';
    } else if (preset === 'dev') {
      document.getElementById('envScheme').value = 'https';
      document.getElementById('envKcHost').value = 'id.sandbox-2.wwwnstcloud.ru';
      document.getElementById('envRealm').value = 'private';
      document.getElementById('envNstHost').value = 'kb-manager-chatbot-dev.sandbox-2.wwwnstcloud.ru';
    }
    updateCalculatedUrls();
  }

  function setTab(tab) {
    document.getElementById('tabUsers').style.display = tab === 'users' ? 'block' : 'none';
    document.getElementById('tabNotify').style.display = tab === 'notify' ? 'block' : 'none';
    
    document.getElementById('tabBtnUsers').classList.toggle('active', tab === 'users');
    document.getElementById('tabBtnNotify').classList.toggle('active', tab === 'notify');
  }

  function displayResponse(status, data) {
    const tag = document.getElementById('statusTag');
    const output = document.getElementById('responseOutput');
    
    if (status >= 200 && status < 300) {
      tag.innerHTML = `<span class="status-tag status-200">HTTP ${status} OK</span>`;
    } else {
      tag.innerHTML = `<span class="status-tag status-err">HTTP ${status} ERROR</span>`;
    }

    output.innerText = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
  }

  function copyCurl() {
    const text = document.getElementById('curlOutput').innerText;
    navigator.clipboard.writeText(text);
    alert('cURL команда скопирована!');
  }

  function promptPasteToken() {
    const token = prompt("Вставьте полученный из консоли access_token (или весь JSON ответа Keycloak):");
    if (token) {
      try {
        const parsed = JSON.parse(token);
        if (parsed.access_token) {
          document.getElementById('bearerToken').value = parsed.access_token;
          return;
        }
      } catch (e) {}
      document.getElementById('bearerToken').value = token.trim();
    }
  }

  // 1. KEYCLOAK TOKEN REQUEST
  async function requestToken() {
    const kcUrl = document.getElementById('kcUrl').value;
    const clientId = document.getElementById('clientId').value;
    const clientSecret = document.getElementById('clientSecret').value;

    const secretDisplay = clientSecret || '<YOUR_CLIENT_SECRET>';
    const curl = `curl -X POST "${kcUrl}" \\\n  -H "Content-Type: application/x-www-form-urlencoded" \\\n  -d "grant_type=client_credentials" \\\n  -d "client_id=${clientId}" \\\n  -d "client_secret=${secretDisplay}"`;
    document.getElementById('curlOutput').innerText = curl;

    if (!clientSecret) {
      displayResponse(400, { error: "Missing Client Secret", details: "Укажите client_secret в форме перед отправкой запроса." });
      return;
    }

    try {
      const params = new URLSearchParams();
      params.append('grant_type', 'client_credentials');
      params.append('client_id', clientId);
      params.append('client_secret', clientSecret);

      const res = await fetch(kcUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await res.json();
      if (data.access_token) {
        document.getElementById('bearerToken').value = data.access_token;
      }
      displayResponse(res.status, data);
    } catch (err) {
      displayResponse(500, {
        error: "Keycloak CORS / Network Error",
        details: err.message,
        solution: "Скопируйте сгенерированный cURL выше, выполните его в терминале и вставьте access_token по кнопке '📋 Вставить токен вручную', либо разрешите Web Origins в Keycloak."
      });
    }
  }

  // 2. GET /users REQUEST
  async function execGetUser() {
    const baseUrl = document.getElementById('apiUrl').value;
    const userId = document.getElementById('getUserUuid').value;
    const token = document.getElementById('bearerToken').value.trim();

    const fullUrl = `${baseUrl}/users?global_user_id=${userId}`;
    const curl = `curl -X GET "${fullUrl}" \\\n  -H "Authorization: Bearer ${token || '<API_TOKEN>'}"`;
    document.getElementById('curlOutput').innerText = curl;

    try {
      const res = await fetch(fullUrl, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      const data = await res.json();
      displayResponse(res.status, data);
    } catch (err) {
      displayResponse(500, { error: "Network Error", details: err.message });
    }
  }

  // 3. POST /notifications REQUEST
  async function execSendNotification() {
    const baseUrl = document.getElementById('apiUrl').value;
    const userId = document.getElementById('postUserUuid').value;
    const channel = document.getElementById('postChannel').value;
    const message = document.getElementById('postMessage').value;
    const token = document.getElementById('bearerToken').value.trim();

    const fullUrl = `${baseUrl}/notifications`;
    const payload = {
      global_user_id: userId,
      channel: channel,
      message: message
    };

    const jsonPayload = JSON.stringify(payload);
    const curl = `curl -X POST "${fullUrl}" \\\n  -H "Authorization: Bearer ${token || '<API_TOKEN>'}" \\\n  -H "Content-Type: application/json; charset=utf-8" \\\n  --data-raw '${jsonPayload}'`;
    document.getElementById('curlOutput').innerText = curl;

    try {
      const res = await fetch(fullUrl, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json; charset=utf-8'
        },
        body: jsonPayload
      });

      const data = await res.json();
      displayResponse(res.status, data);
    } catch (err) {
      displayResponse(500, { error: "Network Error", details: err.message });
    }
  }

  // Инициализация при загрузке страницы
  window.onload = updateCalculatedUrls;
</script>

</body>
</html>
