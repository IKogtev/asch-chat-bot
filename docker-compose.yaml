services:
  postgres:
    image: postgres:16
    container_name: aszh-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aszh-bot
      POSTGRES_PASSWORD: aszh-bot
      POSTGRES_DB: aszh-bot
      TZ: Europe/Moscow
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aszh-bot -d aszh-bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aszh-bot-network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aszh-bot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: vitaly.kogtev@nstdata.ru
      PGADMIN_DEFAULT_PASSWORD: vitaly.kogtev@nstdata.ru
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin_servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin_servers.json:ro
    depends_on:
      - postgres
    networks:
      - aszh-bot-network

  adk-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: aszh-adk-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_MODEL=${LLM_API_MODEL}
      - PORT=8000
      - HOST=0.0.0.0
      - KBSEARCH_MCP_URL=${KBSEARCH_MCP_URL}
      - MCP_TOKEN=${MCP_TOKEN}
      - KB_COLLECTION=${KB_COLLECTION}
    volumes:
      - ./kb_storage/prompts:/app/agent/prompts
    tmpfs:
      - /app/agent/.adk:size=100M
    networks:
      - aszh-bot-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: aszh-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      adk-agent:
        condition: service_started
      kb-manager:
        condition: service_started
    ports:
      - 8001:8001
    env_file:
      - .env
    volumes:
      - ./kb_storage/bot/:/app/data
    environment:
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
      - ADK_API_BASE=http://adk-agent:8000
      - ADK_APP_NAME=agent
      - KB_MANAGER_URL=http://kb-manager:5000
      - PLATFORM_VERSION=0.5.3
      - SHOW_LIST_SIZE=${SHOW_LIST_SIZE:-5}
      - SHOW_BY_PAGE=${SHOW_BY_PAGE:-False}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aszh-bot-network
    dns:
        - 8.8.8.8
        - 1.1.1.1
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage # здесь qdrant будет хранить свои данные индексы
    networks:
      - aszh-bot-network
  kb-manager:
    build:
      context: ./mcps/kb-manager
      dockerfile: Dockerfile
    image: kb-manager:latest
    container_name: kb-manager
    restart: unless-stopped
    ports:
      - 5000:5000
    volumes:
      - ./kb_storage:/app/data/kb_documents
      - ./kb_storage/prompts:/app/data/prompts
      - ./kb_storage/bot:/app/data/bot
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=kb_collection
      - EMBEDDING_MODEL=Qwen/Qwen3-Embedding-0.6B
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=20
      - LOG_TO_FILE=false
      - KB_STORAGE_ROOT=/app/data/kb_documents
      - PROMPTS_STORAGE_ROOT=/app/data/prompts
      - PLATFORM_VERSION=0.5.3
      - BOT_TELEGRAM_API=http://bot:8001
    depends_on:
      - qdrant
    networks:
      - aszh-bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kbsearch:
    build:
      context: ./mcps/mcp-server-kbsearch
      dockerfile: Dockerfile
    image: mcp-server-kbsearch:latest
    container_name: mcp-kbsearch
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      # Основные настройки сервера
      - MCP_HOST=0.0.0.0
      - MCP_PORT=7001
      - MCP_KBSEARCH=/kbsearch
      - MCP_TOKEN=${MCP_TOKEN:-REDACTED_EXAMPLE}
      - IN_DOCKER=true
      - LOG_TO_FILE=false
      - LOG_LEVEL=${KB_LOG_LEVEL:-INFO}
      
      # Настройки удалённого эмбеддинга
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-https://dsrv1.llm.nstcloud.ru/v1/embeddings}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-REDACTED_EXAMPLE}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}

      # Настройки эмбеддинга и индексирования
      - KB_CHUNK_SIZE=512
      - KB_CHUNK_OVERLAP=50
      - KB_SIMILARITY_TOP_K=${KB_SIMILARITY_TOP_K:-15}
      - KB_SIMILARITY_CUTOFF=${KB_SIMILARITY_CUTOFF:-0.5}

      # Qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=kb_collection
      - USE_QDRANT=true
    depends_on:
      kb-manager:
        condition: service_healthy
    networks:
      - aszh-bot-network
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7001/kb/status')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp-filesystem:
    build: 
      context: ./mcps/mcp-filesystem-http
    container_name: mcp-filesystem
    restart: unless-stopped
    ports:
      - "7002:8080" 
    volumes:
      - ./kb_storage:/mcp-filesystem/kb:ro
    networks:
      - aszh-bot-network
    environment:
      - NODE_ENV=production
      
  file-manager:
    image: filegator/filegator:latest
    container_name: kb-file-ui
    user: "0:0" # Запускаем от рута, чтобы отработал chown в скрипте
    restart: unless-stopped
    entrypoint: ["/filegator_init.sh"]
    ports:
      - "8081:8080"
    volumes:
      - ./kb_storage:/var/www/filegator/repository 
      - ./filegator_data:/var/www/filegator/private
      - ./filegator_init.sh:/filegator_init.sh:ro # Прокидываем наш скрипт
    environment:
      - TZ=Europe/Moscow
      # username=admin
      # если хотим изменить то меняем в filegator_init.sh на нужный нам, 
      # только важно вставлять сразу хэш пароля, можно получить вот тут 
      # хэш: https://bcrypt-generator.com/ 
      # password=admin123 
    networks:
      - aszh-bot-network

volumes:
  pg_data:
  pgadmin_data:
  qdrant-storage:

networks:
  aszh-bot-network:
    # external: true
    driver: bridge