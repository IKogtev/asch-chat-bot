services:
  postgres:
    image: postgres:16
    container_name: aszh-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aszh-bot
      POSTGRES_PASSWORD: aszh-bot
      POSTGRES_DB: aszh-bot
      TZ: Europe/Moscow
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aszh-bot -d aszh-bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aszh-bot-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aszh-bot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: vitaly.kogtev@nstdata.ru
      PGADMIN_DEFAULT_PASSWORD: vitaly.kogtev@nstdata.ru
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin_servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin_servers.json:ro
    depends_on:
      - postgres
    networks:
      - aszh-bot-network

  adk-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: aszh-adk-agent
    restart: unless-stopped
    command: >
      sh -c "cd /app && adk api_server . --host 0.0.0.0 --port 8000 --session_service_uri \"$$ADK_SESSION_SERVICE_URI\""
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${AGENT_LOG_LEVEL:-DEBUG}
      - LLM_TRACE_ENABLED=${LLM_TRACE_ENABLED:-false}
      - LLM_TRACE_AGENTS=${LLM_TRACE_AGENTS:-advisor_content_agent}
      - LLM_TRACE_MAX_LENGTH=${LLM_TRACE_MAX_LENGTH:-1000}
      - LLM_TRACE_INCLUDE_CONTENT=${LLM_TRACE_INCLUDE_CONTENT:-false}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_MODEL=${LLM_API_MODEL}
      # путь к бд Насти
      - NSTYA_DATA_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/nstya_data
      - PORT=8000
      - HOST=0.0.0.0
      - ADK_SESSION_SERVICE_URI=postgresql+asyncpg://aszh-bot:aszh-bot@postgres:5432/adk_sessions
      # DocSearchOrchestrator: сохранение списка документов (те же таблицы, что у бота)
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot

      # MCP kb_search
      - KBSEARCH_MCP_URL=http://kbsearch:7001/kbsearch/mcp
      - MCP_TOKEN=${MCP_TOKEN}
      - MCP_TIMEOUT_SEC=${MCP_TIMEOUT_SEC:-60}

      # MCP faq_search
      - FAQSEARCH_MCP_URL=http://faq:7000/faq_rag/mcp
      - FAQSEARCH_MCP_TOKEN=${FAQSEARCH_MCP_TOKEN:-${MCP_TOKEN:-REMOVED_SECRET}}
      - FAQSEARCH_MCP_TIMEOUT_SEC=${FAQSEARCH_MCP_TIMEOUT_SEC:-60}

      # MCP dbhub
      - DBHUB_MCP_URL=${DBHUB_MCP_URL:-http://dbhub:8080/mcp}
      - DBHUB_MCP_TOKEN=${DBHUB_MCP_TOKEN:-${MCP_TOKEN}}
      - DBHUB_MCP_TIMEOUT_SEC=${DBHUB_MCP_TIMEOUT_SEC:-${MCP_TIMEOUT_SEC:-60}}

      # Documents paths
      - ACTIVE_DOCUMENTS_PATH=manager/kb
      - ACTIVE_DOCUMENTS_COLLECTION=kb_collection
      - ARCHIVE_DOCUMENTS_PATH=archive_kb
      - ARCHIVE_DOCUMENTS_COLLECTION=archive_kb_collection
      - KB_DOCUMENTS_PATH=knowledge_base
      - KB_DOCUMENTS_COLLECTION=knowledge_base_collection
      - FAQ_DOCUMENTS_COLLECTION=faq_collection
      - FAQ_DOCUMENTS_PATH=manager/faq
      - GLOSSARY_CACHE_TTL_SEC=600
      - AGENT_DIALOG_MEMORY_MAX_TURNS=${AGENT_DIALOG_MEMORY_MAX_TURNS:-3}

      - KB_TOP_K=${KB_TOP_K:-20}
      - ROOT_TEMPERATURE=0.8
      - OWASP_TEMPERATURE=${OWASP_TEMPERATURE:-0.2}
      - OWASP_TOP_P=${OWASP_TOP_P:-0.95}
      - OWASP_TOP_K=${OWASP_TOP_K:-20}
      - OWASP_MAX_OUTPUT_TOKENS=${OWASP_MAX_OUTPUT_TOKENS:-3000}
      - OWASP_THINKING_TOKEN_BUDGET=${OWASP_THINKING_TOKEN_BUDGET:-2048}
      - OWASP_ENABLE_THINKING=${OWASP_ENABLE_THINKING:-true}
      - DISPATCHER_MAX_OUTPUT_TOKENS=${DISPATCHER_MAX_OUTPUT_TOKENS:-4000}
      - SMALLTALK_MAX_OUTPUT_TOKENS=${SMALLTALK_MAX_OUTPUT_TOKENS:-2000}
      - PRODUCT_CONTENT_MAX_OUTPUT_TOKENS=${PRODUCT_CONTENT_MAX_OUTPUT_TOKENS:-10000}
      - PRODUCT_FORMATTER_MAX_OUTPUT_TOKENS=${PRODUCT_FORMATTER_MAX_OUTPUT_TOKENS:-16000}
      - ADVISOR_MAX_OUTPUT_TOKENS=${ADVISOR_MAX_OUTPUT_TOKENS:-25000}
      - ADVISOR_TOP_N=${ADVISOR_TOP_N:-5}
      - KB_ANSWER_MAX_OUTPUT_TOKENS=${KB_ANSWER_MAX_OUTPUT_TOKENS:-6000}
      - DOC_SEARCH_MAX_OUTPUT_TOKENS=${DOC_SEARCH_MAX_OUTPUT_TOKENS:-16000}
      - DOC_SEARCH_TEMPERATURE=0.0
      - DOC_SEARCH_PRESENCE_PENALTY=${DOC_SEARCH_PRESENCE_PENALTY:-1.0}
      - KB_ANSWER_TEMPERATURE=0.0
      - SMALLTALK_TEMPERATURE=0.8
      - PRODUCT_INFO_TEMPERATURE=0.5
      - PRODUCT_FILTER_TEMPERATURE=0.5
      - ADVISOR_TEMPERATURE=0.5
      - DISPATCHER_TEMPERATURE=0.2
      - LITELLM_REQUEST_TIMEOUT=${LITELLM_REQUEST_TIMEOUT:-90}
      - LITELLM_NUM_RETRIES=${LITELLM_NUM_RETRIES:-1}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-4096}
      - LLM_PRESENCE_PENALTY=${LLM_PRESENCE_PENALTY:-1.5}
      # FALLBACK FRAZE
      # - COMPARE_FRAZE=👉Начните запрос со слова СРАВНИ 
      # - PRODUCT_CARD_KIT_OFFER=👉 Чтобы получить комплект документов напиши "комплект 1234"
    volumes:
      - ./kb_storage/prompts:/app/agent/prompts
    networks:
      - aszh-bot-network
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kbsearch:
        condition: service_healthy
      faq:
        condition: service_healthy

  # НОВЫЙ сервис для миграций alembic, запускается перед всем!!!
  migration:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: aszh-bot-migration
    environment:
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot
      - ADK_SESSION_SERVICE_URI=postgresql+asyncpg://aszh-bot:aszh-bot@postgres:5432/adk_sessions
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "cd /app && python -m scripts.adk_session_db --reset-existing && alembic upgrade head"]
    networks:
      - aszh-bot-network
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: aszh-bot
    restart: unless-stopped
    depends_on:
      migration:
          condition: service_completed_successfully
      postgres:
        condition: service_healthy
      adk-agent:
        condition: service_started
      kb-manager:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    volumes:
      - ./kb_storage/bot/:/app/data
      - ./kb_storage/manager/kb:/app/kb_storage/manager/kb:ro
    environment:
      - LOG_LEVEL=${BOT_LOG_LEVEL:-DEBUG}
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADK_API_BASE=http://adk-agent:8000
      - ADK_APP_NAME=agent
      - ADK_TIMEOUT_SEC=${ADK_TIMEOUT_SEC:-180}
      - KB_MANAGER_URL=http://kb-manager:5000
      - KB_MANAGER_TOKEN=${KB_MANAGER_TOKEN?KB_MANAGER_TOKEN IS REQUIRED}
      - PLATFORM_VERSION=1.0.0
      - SHOW_LIST_SIZE=${SHOW_LIST_SIZE:-5}
      - SHOW_BY_PAGE=${SHOW_BY_PAGE:-False}
      - BOT_START_MESSAGE_FILE=/app/data/settings/bot_start_message.md
      - PRODUCT_KITS_ROOT=/app/kb_storage/manager/kb/1 Продукты
      - ARCHIVE_KITS_ROOT=/app/kb_storage/manager/kb/6 Архив
      #  API Telegram
      - RECONNECT_DELAY_SEC=60
      - KB_TOP_K=${KB_TOP_K:-20}
      - OTP_INTERNAL_SECRET=${OTP_INTERNAL_SECRET:-dev-otp-internal-secret}
      - DOC_SEARCH_ARCHIVE_SECTION=${DOC_SEARCH_ARCHIVE_SECTION:-6 Архив}
    command: ["sh", "-c", "cd /app && exec python -m bot.bot_v6"]
    networks:
      - aszh-bot-network
  bot-max:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: aszh-bot-max
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      adk-agent:
        condition: service_started
      kb-manager:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env
    volumes:
      - ./kb_storage/bot/:/app/data
      - ./kb_storage/manager/kb:/app/kb_storage/manager/kb:ro
    environment:
      - LOG_LEVEL=${BOT_MAX_LOG_LEVEL:-DEBUG}
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - ADK_API_BASE=http://adk-agent:8000
      - ADK_APP_NAME=agent
      - ADK_TIMEOUT_SEC=${ADK_TIMEOUT_SEC:-180}
      - KB_MANAGER_URL=http://kb-manager:5000
      - KB_MANAGER_TOKEN=${KB_MANAGER_TOKEN?KB_MANAGER_TOKEN IS REQUIRED}
      - PLATFORM_VERSION=1.0.0
      - SHOW_LIST_SIZE=${SHOW_LIST_SIZE:-5}
      - SHOW_BY_PAGE=${SHOW_BY_PAGE:-False}
      - BOT_START_MESSAGE_FILE=/app/data/settings/bot_start_message.md
      - PRODUCT_KITS_ROOT=/app/kb_storage/manager/kb/1 Продукты
      - ARCHIVE_KITS_ROOT=/app/kb_storage/manager/kb/6 Архив
      - DOC_SEARCH_ARCHIVE_SECTION=${DOC_SEARCH_ARCHIVE_SECTION:-6 Архив}
      - OTP_INTERNAL_SECRET=${OTP_INTERNAL_SECRET:-dev-otp-internal-secret}
    command: ["sh", "-c", "cd /app && exec python -m bot.max_bot"]
    networks:
      - aszh-bot-network

  web-bff:
    build:
      context: .
      dockerfile: Dockerfile.web-bff
    container_name: aszh-web-bff
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      adk-agent:
        condition: service_started
      kb-manager:
        condition: service_started
      bot:
        condition: service_started
      bot-max:
        condition: service_started
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ./kb_storage/manager/kb:/app/kb_storage/manager/kb:ro
    environment:
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot
      - ADK_API_BASE=http://adk-agent:8000
      - ADK_APP_NAME=agent
      - ADK_TIMEOUT_SEC=${ADK_TIMEOUT_SEC:-180}
      - WEB_BFF_ALLOW_DEV_AUTH=true
      - WEB_BFF_OTP_STUB=false
      - WEB_BFF_OTP_STUB_PHONE=${WEB_BFF_OTP_STUB_PHONE:-}
      - WEB_BFF_OTP_STUB_CODE=${WEB_BFF_OTP_STUB_CODE:-}
      - OTP_INTERNAL_SECRET=${OTP_INTERNAL_SECRET:-dev-otp-internal-secret}
      - BOT_TELEGRAM_API=http://bot:8001
      - BOT_MAX_API=http://bot-max:8002
      - WEB_BFF_PORT=8010
      - KB_MANAGER_URL=http://kb-manager:5000
      - KB_MANAGER_TOKEN=${KB_MANAGER_TOKEN?KB_MANAGER_TOKEN IS REQUIRED}
      - PRODUCT_KITS_ROOT=/app/kb_storage/manager/kb/1 Продукты
      - ARCHIVE_KITS_ROOT=/app/kb_storage/manager/kb/6 Архив
      - WEB_BFF_KB_ROOT=/app/kb_storage/manager/kb
      - DOWNLOADS_DIR=/app/data/upload/web_files
    command: ["sh", "-c", "cd /app && exec python -m web_bff.app"]
    networks:
      - aszh-bot-network

  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: qdrant
    restart: always
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - aszh-bot-network

  kb-manager:
    build:
      context: .
      dockerfile: mcps/kb-manager/Dockerfile
    image: kb-manager:latest
    container_name: kb-manager                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./kb_storage:/app/data/kb_documents
    environment:
      - LOG_LEVEL=${KB_MANAGER_LOG_LEVEL:-DEBUG}
      - LOG_TO_FILE=false
      - KB_MANAGER_TOKEN=${KB_MANAGER_TOKEN?KB_MANAGER_TOKEN IS REQUIRED}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      - QDRANT_COLLECTION=kb_collection
      - EMBEDDING_MODEL=Qwen/Qwen3-Embedding-0.6B
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=20
      - ACTIVE_DOCUMENTS_PATH=manager/kb
      - ACTIVE_DOCUMENTS_COLLECTION=kb_collection
      - ARCHIVE_DOCUMENTS_PATH=archive_kb
      - ARCHIVE_DOCUMENTS_COLLECTION=archive_kb_collection
      - KB_DOCUMENTS_PATH=knowledge_base
      - KB_DOCUMENTS_COLLECTION=knowledge_base_collection
      - FAQ_DOCUMENTS_PATH=manager/faq
      - FAQ_COLLECTION_NAME=faq_collection
      - KB_STORAGE_ROOT=/app/data/kb_documents
      - PROMPTS_STORAGE_ROOT=/app/data/kb_documents/prompts
      - PLATFORM_VERSION=1.0.0
      - BOT_TELEGRAM_API=http://bot:8001
      - BOT_MAX_API=http://bot-max:8002
      - UI_USERS_DATA=admin:admin123:admin,manager:manager:manager # формируем пользователей, две роли - admin и manager
      # шифрование паролей в postges
      - SECRET_KEY=super-secret-key-change-this
      # путь к базе данных
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot
      - NSTYA_DATA_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/nstya_data
      - NSTYA_DATA_SOURCE_DIR=/app/data/kb_documents/manager/tables
      - GLOSSARY_SOURCE_DIR=/app/data/kb_documents/manager/glossary
      - PRODUCT_KITS_ROOT=/app/data/kb_documents/manager/kb/1 Продукты
      - ARCHIVE_KITS_ROOT=/app/data/kb_documents/manager/kb/6 Архив
      - ADK_SESSION_SERVICE_URI=postgresql+asyncpg://aszh-bot:aszh-bot@postgres:5432/adk_sessions
      # настройка интервала синхронизации при старте
      - SYNC_INTERVAL_HOURS=12
      # keycloak information to connect lifepoint
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER?KEYCLOAK_ADDRESS IS REQUIRED}
      - KEYCLOAK_AUDIENCE=lifepoint
      - KEYCLOAK_ALGORITHM=RS256
      - KEYCLOAK_JWKS_CACHE_TTL=3600
      # keycloak для kb-manager ui
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET?KEYCLOAK_CLIENT_SECRET is REQUIRED}
      - KEYCLOAK_PUBLIC_URL=http://localhost:8088
      - REDIRECT_URI=http://localhost:5000/auth/callback
      - POST_LOGOUT_REDIRECT_URI=http://localhost:5000/auth/login
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_REALM=kb-manager-test
      - KEYCLOAK_CLIENT_ID=kb-manager-ui
      # Адреса FileGator для main.py:
      - FILEGATOR_INTERNAL=http://file-manager:8080
      - FILEGATOR_PUBLIC=http://localhost:8081
      - FILEGATOR_ADMIN_PASS=${FILEGATOR_ADMIN_PASS:-admin_secret_pass}
      - FILEGATOR_MANAGER_PASS=${FILEGATOR_MANAGER_PASS:-manager_secret_pass}
      
    depends_on:
      migration:
          condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - aszh-bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8088:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import
      - ./keycloak/themes/kb-manager-theme:/opt/keycloak/themes/kb-manager-theme
    networks:
      - aszh-bot-network
    # Если указать профиль, сервис НЕ будет подниматься по умолчанию на проде (`docker compose up`)
    # Для локального запуска нужно будет передать флаг: `docker compose --profile tools up -d`
    # profiles: ["tools"]

  kbsearch:
    build:
      context: .
      dockerfile: mcps/mcp-server-kbsearch/Dockerfile
    image: mcp-server-kbsearch:latest
    container_name: mcp-kbsearch
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=7001
      - MCP_KBSEARCH=/kbsearch
      - MCP_TOKEN=${MCP_TOKEN:-REMOVED_SECRET}
      - IN_DOCKER=true
      - LOG_TO_FILE=false
      - LOG_LEVEL=${KB_LOG_LEVEL:-DEBUG}

      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-https://api.llm.nstcloud.ru/v1/embeddings}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}

      - KB_CHUNK_SIZE=512
      - KB_CHUNK_OVERLAP=50
      - KB_SIMILARITY_TOP_K=${KB_SIMILARITY_TOP_K:-20}
      - KB_SIMILARITY_CUTOFF=${KB_SIMILARITY_CUTOFF:-0.1}
       
      - KB_RRF_K_DOC_SEARCH=60
      - KB_CANDIDATE_MULT_DOC_SEARCH=120
      - DOC_SEARCH_ARCHIVE_SECTION=${DOC_SEARCH_ARCHIVE_SECTION:-6 Архив}

      - QDRANT_HOST=qdrant 
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=kb_collection
      - USE_QDRANT=true
      - KB_QDRANT_RETRY_INTERVAL=${KB_QDRANT_RETRY_INTERVAL:-5}
      - KB_QDRANT_INIT_TIMEOUT=${KB_QDRANT_INIT_TIMEOUT:-60}

      - EMBEDDING_RETRY_TIMEOUT_SEC=${EMBEDDING_RETRY_TIMEOUT_SEC:-30}
      - EMBEDDING_RETRY_INTERVAL_SEC=${EMBEDDING_RETRY_INTERVAL_SEC:-1}
    depends_on:
      kb-manager:
        condition: service_healthy
    networks:
      - aszh-bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7001/kb/status')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  faq:
    build:
      context: .
      dockerfile: mcps/mcp-server-faq/Dockerfile
    image: mcp-faq-rag:latest
    container_name: mcp-faq
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=7000
      - MCP_FAQPATH=/faq_rag
      - MCP_TOKEN=${FAQSEARCH_MCP_TOKEN:-REMOVED_SECRET}
      - IN_DOCKER=true
      - LOG_TO_FILE=false
      - LOG_LEVEL=${FAQ_LOG_LEVEL:-DEBUG}

      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-https://api.llm.nstcloud.ru/v1/embeddings}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=20
      - SIMILARITY_TOP_K=${FAQ_SIMILARITY_TOP_K:-5}
      - SIMILARITY_CUTOFF=${FAQ_SIMILARITY_CUTOFF:-0.5}
      
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=faq_collection
      - USE_QDRANT=true
      - FAQ_QDRANT_RETRY_INTERVAL=${FAQ_QDRANT_RETRY_INTERVAL:-10}
      - FAQ_QDRANT_INIT_TIMEOUT=${FAQ_QDRANT_INIT_TIMEOUT:-600}

      - EMBEDDING_RETRY_TIMEOUT_SEC=${EMBEDDING_RETRY_TIMEOUT_SEC:-30}
      - EMBEDDING_RETRY_INTERVAL_SEC=${EMBEDDING_RETRY_INTERVAL_SEC:-1}
    depends_on:
      kb-manager:
        condition: service_healthy
    networks:
      - aszh-bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7000/faq/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dbhub:
    image: bytebase/dbhub:latest
    container_name: dbhub
    restart: unless-stopped
    environment:
      - DBHUB_LOG_LEVEL=info
    volumes:
      - ./mcps/dbhub/dbhub_nstya_config.toml:/config/dbhub_nstya_config.toml:ro
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --config
      - /config/dbhub_nstya_config.toml
    depends_on:
      - postgres
    networks:
      - aszh-bot-network
  
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy для снятия ограничений iframe
  # ---------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:alpine
    container_name: kb-filegator-proxy
    restart: unless-stopped
    ports:
      - "8081:80"  # Наружу отдаем 8081 — браузер и iframe стучатся сюда
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - file-manager
    networks:
      - aszh-bot-network

  file-manager:
    image: filegator/filegator:latest
    container_name: kb-file-ui
    user: "0:0"
    restart: unless-stopped
    entrypoint: ["/filegator_init.sh"]
    ports:
      - "8080"
    volumes:
      - ./kb_storage:/var/www/filegator/repository
      - ./filegator_data:/var/www/filegator/private
      - ./filegator_init.sh:/filegator_init.sh:ro
    environment:
      - TZ=Europe/Moscow
      # Переменные для автоматического создания пользователя:
      - SECRET_KEY=super-secret-key-change-this
      - FILEGATOR_ADMIN_PASS=${FILEGATOR_ADMIN_PASS:-admin_secret_pass}
      - FILEGATOR_MANAGER_PASS=${FILEGATOR_MANAGER_PASS:-manager_secret_pass}
    networks:
      - aszh-bot-network

  adk-web:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: aszh-adk-web
    command: >
      sh -c "cd /app && adk web --host 0.0.0.0 --port 8080 --session_service_uri \"$$ADK_SESSION_SERVICE_URI\""
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${ADK_WEB_LOG_LEVEL:-DEBUG}
      - LLM_TRACE_ENABLED=${LLM_TRACE_ENABLED:-false}
      - LLM_TRACE_AGENTS=${LLM_TRACE_AGENTS:-advisor_content_agent}
      - LLM_TRACE_MAX_LENGTH=${LLM_TRACE_MAX_LENGTH:-1000}
      - LLM_TRACE_INCLUDE_CONTENT=${LLM_TRACE_INCLUDE_CONTENT:-false}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_MODEL=${LLM_API_MODEL}
      - DEBUG_EXCEPTIONS=true
      - ADK_SESSION_SERVICE_URI=postgresql+asyncpg://aszh-bot:aszh-bot@postgres:5432/adk_sessions
      
      # MCP kb_search
      - KBSEARCH_MCP_URL=http://kbsearch:7001/kbsearch/mcp
      - MCP_TOKEN=${MCP_TOKEN}
      - MCP_TIMEOUT_SEC=${MCP_TIMEOUT_SEC:-60}

      # MCP faq_search
      - FAQSEARCH_MCP_URL=http://faq:7000/faq_rag/mcp
      - FAQSEARCH_MCP_TOKEN=${FAQSEARCH_MCP_TOKEN:-${MCP_TOKEN:-REMOVED_SECRET}}
      - FAQSEARCH_MCP_TIMEOUT_SEC=${FAQSEARCH_MCP_TIMEOUT_SEC:-60}

      # MCP dbhub
      - DBHUB_MCP_URL=${DBHUB_MCP_URL:-http://dbhub:8080/mcp}
      - DBHUB_MCP_TOKEN=${DBHUB_MCP_TOKEN:-${MCP_TOKEN}}
      - DBHUB_MCP_TIMEOUT_SEC=${DBHUB_MCP_TIMEOUT_SEC:-${MCP_TIMEOUT_SEC:-60}}

      - ACTIVE_DOCUMENTS_COLLECTION=kb_collection
      - KB_DOCUMENTS_COLLECTION=knowledge_base_collection
      - FAQ_DOCUMENTS_COLLECTION=faq_collection
      - GLOSSARY_CACHE_TTL_SEC=600
      - AGENT_DIALOG_MEMORY_MAX_TURNS=${AGENT_DIALOG_MEMORY_MAX_TURNS:-3}

      - KB_TOP_K=${KB_TOP_K:-20}
      - ROOT_TEMPERATURE=0.8
      - OWASP_TEMPERATURE=${OWASP_TEMPERATURE:-0.2}
      - OWASP_TOP_P=${OWASP_TOP_P:-0.95}
      - OWASP_TOP_K=${OWASP_TOP_K:-20}
      - OWASP_MAX_OUTPUT_TOKENS=${OWASP_MAX_OUTPUT_TOKENS:-3000}
      - OWASP_THINKING_TOKEN_BUDGET=${OWASP_THINKING_TOKEN_BUDGET:-2048}
      - OWASP_ENABLE_THINKING=${OWASP_ENABLE_THINKING:-true}
      - DISPATCHER_MAX_OUTPUT_TOKENS=${DISPATCHER_MAX_OUTPUT_TOKENS:-4000}
      - SMALLTALK_MAX_OUTPUT_TOKENS=${SMALLTALK_MAX_OUTPUT_TOKENS:-2000}
      - PRODUCT_CONTENT_MAX_OUTPUT_TOKENS=${PRODUCT_CONTENT_MAX_OUTPUT_TOKENS:-10000}
      - PRODUCT_FORMATTER_MAX_OUTPUT_TOKENS=${PRODUCT_FORMATTER_MAX_OUTPUT_TOKENS:-6000}
      - ADVISOR_MAX_OUTPUT_TOKENS=${ADVISOR_MAX_OUTPUT_TOKENS:-25000}
      - ADVISOR_TOP_N=${ADVISOR_TOP_N:-5}
      - KB_ANSWER_MAX_OUTPUT_TOKENS=${KB_ANSWER_MAX_OUTPUT_TOKENS:-6000}
      - DOC_SEARCH_MAX_OUTPUT_TOKENS=${DOC_SEARCH_MAX_OUTPUT_TOKENS:-6000}
      - DOC_SEARCH_TEMPERATURE=0.0
      - DOC_SEARCH_PRESENCE_PENALTY=${DOC_SEARCH_PRESENCE_PENALTY:-0.0}
      - KB_ANSWER_TEMPERATURE=0.0
      - SMALLTALK_TEMPERATURE=0.8
      - PRODUCT_INFO_TEMPERATURE=0.5
      - PRODUCT_FILTER_TEMPERATURE=0.5
      - ADVISOR_TEMPERATURE=0.5
      - DISPATCHER_TEMPERATURE=0.2
      - LITELLM_REQUEST_TIMEOUT=${LITELLM_REQUEST_TIMEOUT:-90}
      - LITELLM_NUM_RETRIES=${LITELLM_NUM_RETRIES:-1}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-4096}
      - LLM_PRESENCE_PENALTY=${LLM_PRESENCE_PENALTY:-1.5}
    volumes:
      - ./kb_storage/prompts:/app/agent/prompts
    networks:
      - aszh-bot-network
    depends_on:
      migration:
        condition: service_completed_successfully
      kbsearch:
        condition: service_healthy
      faq:
        condition: service_healthy

volumes:
  pg_data:
  pgadmin_data:
  qdrant-storage:
  keycloak_data:

networks:
  aszh-bot-network:
    driver: bridge
