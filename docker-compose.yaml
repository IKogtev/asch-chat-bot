services:
  postgres:
    image: postgres:16
    container_name: aszh-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aszh-bot
      POSTGRES_PASSWORD: aszh-bot
      POSTGRES_DB: aszh-bot
      TZ: Europe/Moscow
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aszh-bot -d aszh-bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aszh-bot-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aszh-bot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: vitaly.kogtev@nstdata.ru
      PGADMIN_DEFAULT_PASSWORD: vitaly.kogtev@nstdata.ru
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin_servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin_servers.json:ro
    depends_on:
      - postgres
    networks:
      - aszh-bot-network

  adk-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: aszh-adk-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_MODEL=${LLM_API_MODEL}
      - PORT=8000
      - HOST=0.0.0.0
      # DocSearchOrchestrator: сохранение списка документов (те же таблицы, что у бота)
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot

      # MCP kb_search
      - KBSEARCH_MCP_URL=http://kbsearch:7001/kbsearch/mcp
      - MCP_TOKEN=${MCP_TOKEN}
      - MCP_TIMEOUT_SEC=${MCP_TIMEOUT_SEC:-60}

      # Documents paths
      - ACTIVE_DOCUMENTS_PATH=${ACTIVE_DOCUMENTS_PATH:-kb/}
      - ACTIVE_DOCUMENTS_COLLECTION=${ACTIVE_DOCUMENTS_COLLECTION:-kb_collection}
      - ARCHIVE_DOCUMENTS_PATH=${ARCHIVE_DOCUMENTS_PATH:-archive_kb/}
      - ARCHIVE_DOCUMENTS_COLLECTION=${ARCHIVE_DOCUMENTS_COLLECTION:-archive_kb_collection}
      - KB_DOCUMENTS_PATH=${KB_DOCUMENTS_PATH:-knowledge_base/}
      - KB_DOCUMENTS_COLLECTION=${KB_DOCUMENTS_COLLECTION:-kb_collection}

      - KB_TOP_K=${KB_TOP_K:-5}
    volumes:
      - ./agent:/app/agent
      - ./kb_storage/prompts:/app/agent/prompts
    tmpfs:
      - /app/agent/.adk:size=100M
    networks:
      - aszh-bot-network
    depends_on:
      postgres:
        condition: service_healthy
      kbsearch:
        condition: service_healthy

  # AG-UI bridge for CopilotKit (same agent code + MCP as adk-agent; separate process)
  ag-ui-adapter:
    build:
      context: .
      dockerfile: Dockerfile.ag_ui
    container_name: aszh-ag-ui-adapter
    restart: unless-stopped
    depends_on:
      kbsearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_MODEL=${LLM_API_MODEL}
      - KBSEARCH_MCP_URL=${KBSEARCH_MCP_URL}
      - MCP_TOKEN=${MCP_TOKEN}
      - KB_DEFAULT_COLLECTION=${KB_COLLECTION:-kb_collection}
      - ADK_APP_NAME=${ADK_APP_NAME:-agent}
      - AG_UI_ADAPTER_API_KEY=${AG_UI_ADAPTER_API_KEY:-}
    volumes:
      - ./kb_storage/prompts:/app/agent/prompts
    ports:
      - "8010:8010"
    networks:
      - aszh-bot-network

  copilot-web:
    build:
      context: ./web/copilot-web
      dockerfile: Dockerfile
    container_name: aszh-copilot-web
    restart: unless-stopped
    depends_on:
      - ag-ui-adapter
    environment:
      - ADK_AG_UI_URL=http://ag-ui-adapter:8010
      - ADK_AG_UI_API_KEY=${AG_UI_ADAPTER_API_KEY:-}
    ports:
      - "3000:3000"
    networks:
      - aszh-bot-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: aszh-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      adk-agent:
        condition: service_started
      kb-manager:
        condition: service_started
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./kb_storage/bot/:/app/data
    environment:
      - DATABASE_URL=postgresql://aszh-bot:aszh-bot@postgres:5432/aszh-bot
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADK_API_BASE=http://adk-agent:8000
      - ADK_APP_NAME=agent
      - KB_MANAGER_URL=http://kb-manager:5000
      - PLATFORM_VERSION=0.6.0
      - SHOW_LIST_SIZE=${SHOW_LIST_SIZE:-5}
      - SHOW_BY_PAGE=${SHOW_BY_PAGE:-False}
    networks:
      - aszh-bot-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - aszh-bot-network

  kb-manager:
    build:
      context: ./mcps/kb-manager
      dockerfile: Dockerfile
    image: kb-manager:latest
    container_name: kb-manager                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./kb_storage:/app/data/kb_documents
      - ./kb_storage/prompts:/app/data/prompts
      - ./kb_storage/bot:/app/data/bot
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${ACTIVE_DOCUMENTS_COLLECTION:-kb_collection}
      - EMBEDDING_MODEL=Qwen/Qwen3-Embedding-0.6B
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=20
      - LOG_TO_FILE=false
      - KB_STORAGE_ROOT=/app/data/kb_documents
      - PROMPTS_STORAGE_ROOT=/app/data/prompts
      - PLATFORM_VERSION=0.6.0
      - BOT_TELEGRAM_API=http://bot:8001
    depends_on:
      - qdrant
    networks:
      - aszh-bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kbsearch:
    build:
      context: ./mcps/mcp-server-kbsearch
      dockerfile: Dockerfile
    image: mcp-server-kbsearch:latest
    container_name: mcp-kbsearch
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=7001
      - MCP_KBSEARCH=/kbsearch
      - MCP_TOKEN=${MCP_TOKEN:-REDACTED_EXAMPLE}
      - IN_DOCKER=true
      - LOG_TO_FILE=false
      - LOG_LEVEL=${KB_LOG_LEVEL:-INFO}

      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-https://dsrv1.llm.nstcloud.ru/v1/embeddings}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-REDACTED_EXAMPLE}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}

      - KB_CHUNK_SIZE=512
      - KB_CHUNK_OVERLAP=50
      - KB_SIMILARITY_TOP_K=${KB_SIMILARITY_TOP_K:-15}
      - KB_SIMILARITY_CUTOFF=${KB_SIMILARITY_CUTOFF:-0.15}

      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${ACTIVE_DOCUMENTS_COLLECTION:-kb_collection}
      - USE_QDRANT=true
    depends_on:
      kb-manager:
        condition: service_healthy
    networks:
      - aszh-bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7001/kb/status')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp-filesystem:
    build:
      context: ./mcps/mcp-filesystem-http
    container_name: mcp-filesystem
    restart: unless-stopped
    ports:
      - "7002:8080"
    volumes:
      - ./kb_storage:/mcp-filesystem/kb:ro
    networks:
      - aszh-bot-network
    environment:
      - NODE_ENV=production

  file-manager:
    image: filegator/filegator:latest
    container_name: kb-file-ui
    user: "0:0"
    restart: unless-stopped
    entrypoint: ["/filegator_init.sh"]
    ports:
      - "8081:8080"
    volumes:
      - ./kb_storage:/var/www/filegator/repository
      - ./filegator_data:/var/www/filegator/private
      - ./filegator_init.sh:/filegator_init.sh:ro
    environment:
      - TZ=Europe/Moscow
    networks:
      - aszh-bot-network

  adk-web:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: aszh-adk-web
    command: >
      sh -c "cd /app && adk web --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_MODEL=${LLM_API_MODEL}

      # MCP kb_search
      - KBSEARCH_MCP_URL=http://kbsearch:7001/kbsearch/mcp
      - MCP_TOKEN=${MCP_TOKEN}
      - MCP_TIMEOUT_SEC=${MCP_TIMEOUT_SEC:-60}

      # Documents paths
      - ACTIVE_DOCUMENTS_PATH=${ACTIVE_DOCUMENTS_PATH:-kb/}
      - ACTIVE_DOCUMENTS_COLLECTION=${ACTIVE_DOCUMENTS_COLLECTION:-kb_collection}
      - ARCHIVE_DOCUMENTS_PATH=${ARCHIVE_DOCUMENTS_PATH:-archive_kb/}
      - ARCHIVE_DOCUMENTS_COLLECTION=${ARCHIVE_DOCUMENTS_COLLECTION:-archive_kb_collection}
      - KB_DOCUMENTS_PATH=${KB_DOCUMENTS_PATH:-knowledge_base/}
      - KB_DOCUMENTS_COLLECTION=${KB_DOCUMENTS_COLLECTION:-kb_collection}

      - KB_TOP_K=${KB_TOP_K:-5}
    volumes:
      - ./agent:/app/agent
      - ./kb_storage/prompts:/app/agent/prompts
    networks:
      - aszh-bot-network
    depends_on:
      kbsearch:
        condition: service_healthy

  # Запуск интеграционных тестов агента внутри aszh-bot-network (MCP: http://kbsearch:7001/...).
  # Сборка/запуск: docker compose --profile tests build agent-tests
  #                docker compose --profile tests run --rm agent-tests
  # Доп. аргументы: docker compose --profile tests run --rm agent-tests python -m pytest tests/agent/ -s -k doc_search
  agent-tests:
    profiles:
      - tests
    build:
      context: .
      dockerfile: Dockerfile.agent-tests
    image: agent-tests:latest
    container_name: aszh-agent-tests
    env_file:
      - .env
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_MODEL=${LLM_API_MODEL}
      - KBSEARCH_MCP_URL=http://kbsearch:7001/kbsearch/mcp
      - MCP_TOKEN=${MCP_TOKEN}
      - MCP_TIMEOUT_SEC=${MCP_TIMEOUT_SEC:-60}
      - ACTIVE_DOCUMENTS_COLLECTION=${ACTIVE_DOCUMENTS_COLLECTION:-kb_collection}
      - KB_DOCUMENTS_COLLECTION=${KB_DOCUMENTS_COLLECTION:-kb_collection}
      - AGENT_TESTS_IN_DOCKER=1
    volumes:
      - ./agent:/app/agent
      - ./utils:/app/utils
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini:ro
      - ./kb_storage/prompts:/app/agent/prompts
    working_dir: /app
    networks:
      - aszh-bot-network
    depends_on:
      kbsearch:
        condition: service_healthy

volumes:
  pg_data:
  pgadmin_data:
  qdrant-storage:

networks:
  aszh-bot-network:
    driver: bridge